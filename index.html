<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Master</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .calculadora {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .display {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            background-color: #fff;
            border: none;
            text-align: right;
            padding: 5px;
            font-size: 20px;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            background-color: #666;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #999;
        }
        .operador {
            background-color: #ff9500;
        }
        .igual {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <input type="text" class="display" disabled>
        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="deletar()">←</button>
            <button onclick="adicionar('/')" class="operador">/</button>
            <button onclick="adicionar('*')" class="operador">×</button>
            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('-')" class="operador">-</button>
            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('+')" class="operador">+</button>
            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button onclick="calcular()" class="igual">=</button>
            <button onclick="adicionar('0')" style="grid-column: span 2;">0</button>
            <button onclick="adicionar('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.querySelector('.display');

        function adicionar(valor) {
            display.value += valor;
        }

        function limpar() {
            display.value = '';
        }

        function deletar() {
            display.value = display.value.slice(0, -1);
        }

        function calcular() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = 'Erro';
                setTimeout(limpar, 1500);
            }
        }
    </script>
</body>
</html>
